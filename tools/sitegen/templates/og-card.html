<!doctype html>
<!--
  Source for docs/assets/og-card.png — the site-wide Open Graph share card,
  used for every page that has no lead image of its own. Colours and the
  wordmark treatment mirror site.css (.wordmark / .mark / --chrome-bg), so
  keep the two in step if the brand changes.

  This file is not copied into docs/; it is only the source the PNG is
  rendered from. To regenerate after editing, from the repo root:

    chrome --headless --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --screenshot=docs/assets/og-card.png \
      tools/sitegen/templates/og-card.html

  Chrome needs absolute paths on Windows. The output must stay 1200x630 —
  render.rs advertises those dimensions in og:image:width / og:image:height.
-->
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 92px;
    background: linear-gradient(180deg, #3a4048 0%, #2b2f36 48%, #23262b 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative; overflow: hidden;
  }
  /* soft yellow bloom behind the mark, echoing the site's active-state glow */
  body::before {
    content: ""; position: absolute; top: -180px; left: -140px;
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(245,197,24,.13) 0%, rgba(245,197,24,0) 68%);
  }
  .wordmark { display: flex; align-items: center; gap: 30px; position: relative; }
  .mark {
    width: 116px; height: 116px; border-radius: 26px; flex: none;
    display: grid; place-items: center;
    background: #F5C518; color: #2b2f36;
    font-weight: 800; font-size: 84px; letter-spacing: -4px;
    box-shadow: 0 4px 14px rgba(0,0,0,.34);
  }
  .name {
    font-weight: 800; font-size: 54px; letter-spacing: .14em;
    color: #F5C518; line-height: 1;
  }
  .name .lo { color: #b9a24e; font-weight: 700; }

  .rule { width: 96px; height: 5px; border-radius: 3px; background: #F5C518; margin: 44px 0 30px; position: relative; }

  .tagline { font-size: 39px; font-weight: 500; color: #eef1f4; letter-spacing: -.01em; position: relative; }

  .url {
    position: absolute; right: 92px; bottom: 62px;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 25px; color: #8a929c; letter-spacing: .02em;
  }
</style>
<div class="wordmark">
  <div class="mark">R</div>
  <div class="name">RUSTY <span class="lo">YELLOW PAGES</span></div>
</div>
<div class="rule"></div>
<div class="tagline">A free, open-source Rust reference.</div>
<div class="url">rustyyellowpages.dev</div>
